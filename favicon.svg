<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Outer gold ring -->
  <circle cx="32" cy="32" r="31" fill="#0D0D0D" stroke="#D4A520" stroke-width="2.2"/>

  <!-- Volleyball + speed lines -->
  <line x1="14" y1="16" x2="22" y2="20" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <line x1="12" y1="20" x2="20" y2="23" stroke="white" stroke-width="0.9" stroke-linecap="round" opacity="0.45"/>
  <circle cx="27" cy="13" r="6.5" fill="#0D0D0D" stroke="#D4A520" stroke-width="1.4"/>
  <path d="M21 11.5 Q27 14 21 16.5" stroke="#D4A520" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M33 11.5 Q27 14 33 16.5" stroke="#D4A520" stroke-width="1" fill="none" stroke-linecap="round"/>
  <line x1="20.5" y1="14" x2="33.5" y2="14" stroke="#D4A520" stroke-width="1" opacity="0.7"/>

  <!-- NL letters italic bold -->
