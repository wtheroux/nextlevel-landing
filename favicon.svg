    <text x="5" y="50" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="38" fill="white">N</text>
    <text x="30" y="50" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="38" fill="#D4A520">L</text>
